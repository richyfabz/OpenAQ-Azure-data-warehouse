bundle:
  name: openaq-databricks

# Only the transformation package ships to the workspace; no .git here, so be explicit.
sync:
  include:
    - spark/**
  exclude:
    - spark/**/__pycache__/**
    - spark/.DS_Store

variables:
  catalog:
    description: Unity Catalog holding the bronze/silver/gold schemas (override per environment)
    default: workspace
  bronze_schema:
    description: Bronze schema for the selected environment
    default: bronze
  silver_schema:
    description: Silver schema for the selected environment
    default: silver
  gold_schema:
    description: Gold schema for the selected environment
    default: gold

resources:
  jobs:
    openaq_medallion_pipeline:
      name: openaq_medallion_pipeline
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            client: "4"
      tasks:
        - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/spark/runners/run_bronze.py
            parameters:
              - --package-root=${workspace.file_path}
              - --catalog=${var.catalog}
              - --bronze-schema=${var.bronze_schema}
              - --silver-schema=${var.silver_schema}
              - --gold-schema=${var.gold_schema}
        - task_key: silver
          environment_key: default
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: ${workspace.file_path}/spark/runners/run_silver.py
            parameters:
              - --package-root=${workspace.file_path}
              - --catalog=${var.catalog}
              - --bronze-schema=${var.bronze_schema}
              - --silver-schema=${var.silver_schema}
              - --gold-schema=${var.gold_schema}
        - task_key: gold
          environment_key: default
          depends_on:
            - task_key: silver
          spark_python_task:
            python_file: ${workspace.file_path}/spark/runners/run_gold.py
            parameters:
              - --package-root=${workspace.file_path}
              - --catalog=${var.catalog}
              - --bronze-schema=${var.bronze_schema}
              - --silver-schema=${var.silver_schema}
              - --gold-schema=${var.gold_schema}

targets:
  dev:
    default: true
    workspace:
      profile: openaq
  uat:
    workspace:
      profile: openaq
    variables:
      bronze_schema: uat_bronze
      silver_schema: uat_silver
      gold_schema: uat_gold
